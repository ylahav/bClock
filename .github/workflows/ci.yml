name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the local toolchain (`flutter --version`).
  FLUTTER_VERSION: 3.47.5

jobs:
  test:
    name: Analyze & test
    # Linux: the tests don't touch Windows APIs, and Linux minutes are
    # cheaper than Windows ones on a private repo.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Fails if the .arb files and the committed generated localizations
      # have drifted apart.
      - name: Check generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - run: flutter analyze

      - run: flutter test

  build:
    name: Windows release build
    needs: test
    # Only for main and manual runs — Windows minutes cost 2x.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: bclock-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 14

      # Same script as a local build; the release build above is reused.
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          ./installer/build.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: bclock-setup-${{ github.sha }}
          path: build/installer/*.exe
          retention-days: 14

  build-linux:
    name: Linux release build
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # GTK for Flutter itself; X11/XInput for the tray; GStreamer for
      # audioplayers.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libx11-dev libxi-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build linux --release

      # tar keeps the executable bit, which a zip artifact would lose.
      - name: Pack the bundle
        run: tar -czf bclock-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: bclock-linux-${{ github.sha }}
          path: bclock-linux-x64.tar.gz
          retention-days: 14

  build-macos:
    name: macOS release build
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build macos --release

      # ditto keeps the app bundle's symlinks and attributes intact.
      - name: Pack the app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/bClock.app bClock-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bclock-macos-${{ github.sha }}
          path: bClock-macos.zip
          retention-days: 14
